[project]
name = "school-lunch-api"
version = "0.1.0"
description = "Backend API for the school lunch application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[dependency-groups]
dev = [
    "coverage>=7.6,<8.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "respx>=0.21,<1.0",
]

[tool.pytest.ini_options]
addopts = "--strict-markers"
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
    "unit: tests with no HTTP I/O",
    "integration: tests of FastAPI endpoints with mocked upstream HTTP",
]

[tool.coverage.run]
source = ["app"]
branch = true
